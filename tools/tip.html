<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小費計算機 · Sunny Wen</title>
  <meta name="description" content="輸入消費金額、小費比例和人數，算出含小費每人要付多少，小數一律進位。">
  <link rel="stylesheet" href="../styles/design-tokens.css">
  <link rel="stylesheet" href="../styles/main.css">
  <link rel="stylesheet" href="../styles/tools.css">
</head>
<body>
  <main class="page page--tool">

    <!-- 區塊：返回連結 · 用途：讓人從工具頁回到作品集首頁 · 不建議刪，否則手機上只能按上一頁 -->
    <a class="back-link" href="../index.html">← 回作品集</a>

    <!-- 區塊：工具標題 · 用途：說明這個工具做什麼、怎麼算 · 不建議刪 -->
    <header class="tool-header">
      <h1 class="tool-title">小費計算機</h1>
      <p class="tool-intro">輸入消費金額、小費比例和人數，算出含小費每人要付多少。小數一律進位，不會有人少付。</p>
    </header>

    <!-- 區塊：輸入表單 · 用途：三個輸入欄加計算按鈕 · 不可刪，這是工具本體
         id（bill、tip-rate、people、tip-form、calc-button）是給 JS 找元素用的名牌，改了 scripts/tip.js 要一起改 -->
    <form class="tool-form tool-form--three" id="tip-form" novalidate>
      <div class="field">
        <label class="field__label" for="bill">消費金額（元）</label>
        <input class="field__input" id="bill" name="bill" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 1200">
      </div>
      <div class="field">
        <label class="field__label" for="tip-rate">小費比例（%）</label>
        <input class="field__input" id="tip-rate" name="tip-rate" type="text" inputmode="decimal" autocomplete="off" placeholder="例如 10">
      </div>
      <div class="field">
        <label class="field__label" for="people">人數</label>
        <input class="field__input" id="people" name="people" type="text" inputmode="numeric" autocomplete="off" placeholder="例如 3">
      </div>
      <button class="tool-button" id="calc-button" type="submit">計算</button>
    </form>

    <!-- 區塊：結果 · 用途：顯示三種狀態（還沒填／填錯了／算出來了） · 不可刪
         id（result、result-main、result-detail）改了 scripts/tip.js 要一起改；aria-live 讓螢幕閱讀器在內容改變時自動念出來 -->
    <section class="result result--empty" id="result" aria-live="polite">
      <p class="result__main" id="result-main">填好消費金額、小費比例和人數，按「計算」就會顯示每人要付多少。</p>
      <p class="result__detail" id="result-detail"></p>
    </section>

  </main>
  <script src="../scripts/tip.js"></script>
</body>
</html>
